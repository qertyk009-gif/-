<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="1" stop-color="#0c1620"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e8a93a"/>
    </linearGradient>
    <linearGradient id="hammerHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4c4"/>
      <stop offset="1" stop-color="#6e818f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Wallet body -->
  <rect x="96" y="208" width="320" height="196" rx="28" fill="#2e4a63" stroke="#16222e" stroke-width="8"/>
  <rect x="96" y="208" width="320" height="56" rx="18" fill="#3a5c79"/>
  <!-- Wallet flap/clasp -->
  <circle cx="368" cy="300" r="18" fill="url(#coin)" stroke="#8a5a14" stroke-width="4"/>

  <!-- Coin stack behind wallet -->
  <ellipse cx="170" cy="392" rx="46" ry="14" fill="#c78b2a"/>
  <ellipse cx="170" cy="378" rx="46" ry="14" fill="url(#coin)" stroke="#c78b2a" stroke-width="4"/>
  <text x="170" y="386" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#8a5a14" text-anchor="middle">₴</text>

  <!-- Hammer crossing over wallet (tool/repair motif) -->
  <g transform="rotate(-35 340 170)">
    <rect x="300" y="160" width="140" height="26" rx="8" fill="url(#hammerHead)" stroke="#45545d" stroke-width="4"/>
    <rect x="325" y="178" width="18" height="120" rx="8" fill="#8a5a33" stroke="#5c3a20" stroke-width="4"/>
  </g>

  <!-- Highlight -->
  <ellipse cx="200" cy="230" rx="90" ry="18" fill="#ffffff" opacity="0.08"/>
</svg>
